[project]
name = "dos-mcp"
version = "0.1.1"
description = "DOSBox-X control tools for DOS malware analysis"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["mcp==1.28.1"]

[project.scripts]
dos-mcp = "dos_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dos_mcp"]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["dos_mcp"]
mypy_path = "src"

